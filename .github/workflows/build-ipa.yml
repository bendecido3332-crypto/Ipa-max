name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q EscritorioIA.zip
      - name: Compilar y empaquetar
        run: |
          cd EscritorioIA
          brew install xcodegen
          xcodegen
          xcodebuild -project EscritorioIA.xcodeproj -scheme EscritorioIA \
            -configuration Release -sdk iphoneos -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          cd ..
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EscritorioIA.app Payload/
          zip -qr EscritorioIA.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: EscritorioIA-ipa
          path: EscritorioIA.ipa
